# Minimal CI: every push to any branch + every PR runs the four checks
# the pre-commit hook can't (or shouldn't) run on the developer's machine —
# typecheck, full test suite, full build. Lint is duplicated from
# pre-commit so PRs from contributors without our husky setup still
# get checked.
name: CI

on:
  push:
    # Dependabot branches are checked by their pull_request run; a push run
    # on top of it would only duplicate the same check.
    branches: ['**', '!dependabot/**']
  pull_request:
  workflow_dispatch:
    inputs:
      verify_only:
        description: Validate CI and keyless Google deployment access without publishing
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # 15 (not 10): the rules step downloads the Firestore emulator jar and
    # boots the JVM before any test runs (firebase-tools itself is a pinned
    # devDependency installed by `npm ci`).
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Setup npm
        run: npm install --global npm@11.21.0

      # vite-plugin-pwa 2 支援 Vite 8，安裝必須遵守 peer dependency 約束。
      # firebase-functions is a standalone package (not a workspace): its own
      # package-lock.json is the one Cloud Build installs, so CI installs and
      # audits that same lockfile.
      - name: Install
        run: |
          npm ci
          npm ci --prefix firebase-functions

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Audit Functions dependencies
        run: npm audit --prefix firebase-functions --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Same suite as `npm test`, plus the coverage floors in vitest.config.ts.
      - name: Test (with coverage thresholds)
        run: npm run test:coverage

      # Root `npm test` only scans src/** + packages/**; the Worker has its
      # own vitest config (Cloudflare Workers pool) and lives outside that
      # glob. Without this step the Worker's ~350-test suite would never run
      # in CI, which is the exact silent-gap class the root glob comment warns
      # against. Keep this in sync with the Worker test command in CLAUDE.md.
      - name: Test (Worker)
        working-directory: workers/ocr
        run: npx vitest run

      # firebase-functions has its own vitest config and lives outside the
      # root glob (src/** + packages/**), same as the Worker above. Typecheck
      # already covers it via `npm run typecheck` (--prefix), but the test
      # run does not — without this step the push dispatch/normalize/send
      # suite never executes in CI.
      - name: Test (functions)
        run: npm run functions:test

      # The rules suite runs against the Firestore emulator, which needs a JVM.
      # This is exactly the kind of check that shouldn't require every dev to
      # install a JDK locally — CI is the environment that has Java.
      - name: Setup Java
        # 21 (not 17): current firebase-tools dropped support for JDK < 21, so
        # the emulator refuses to start on anything older.
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Test (rules)
        run: npm run test:rules

      # Worker settlement writes against the same emulator: transactional
      # projections, conflicts and the 1 MiB document limit.
      - name: Test (emulator)
        run: npm run test:emulator

      - name: Build
        run: npm run build
        env:
          # The Firebase config is read from import.meta.env at build time.
          # CI doesn't deploy, so feed it placeholders that satisfy
          # firebase.ts:33 fail-fast validation. Real values are set per
          # environment in the deploy pipeline.
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: ci.example.com
          VITE_FIREBASE_PROJECT_ID: ci-placeholder
          VITE_FIREBASE_MESSAGING_SENDER_ID: '0'
          VITE_FIREBASE_VAPID_KEY: ci-placeholder
          VITE_FIREBASE_APP_ID: '0:ci'

  deploy:
    name: Deploy production
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    # Do not interrupt a release between Worker, Functions, Rules and Pages.
    concurrency:
      group: tripmate-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Reject a superseded commit
        env:
          TESTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$TESTED_SHA"

      - name: Check deployment configuration
        env:
          VERIFY_ONLY: ${{ inputs.verify_only }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID GCP_WORKLOAD_IDENTITY_PROVIDER GCP_DEPLOY_SERVICE_ACCOUNT; do
            if [ "$VERIFY_ONLY" = 'true' ] && [[ "$name" == CLOUDFLARE_* ]]; then continue; fi
            if [ -z "${!name}" ]; then
              echo "::error::Missing production configuration: $name"
              exit 1
            fi
          done

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Setup npm
        run: npm install --global npm@11.21.0

      # Install before obtaining cloud credentials; never expose them to CI tests.
      # Functions' predeploy build uses its own TypeScript install.
      - name: Install
        run: |
          npm ci
          npm ci --prefix firebase-functions

      - name: Authenticate Google Cloud with WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: tripplanner-80a4f
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Verify keyless infrastructure access
        run: |
          gcloud firestore indexes composite list --project tripplanner-80a4f --format='value(name)' >/dev/null
          gcloud run services list --region asia-east1 --project tripplanner-80a4f --format='value(metadata.name)' >/dev/null
          gcloud artifacts repositories describe gcf-artifacts --location asia-east1 --project tripplanner-80a4f --format='value(name)' >/dev/null
          npx --no-install firebase functions:list --project tripplanner-80a4f >/dev/null

      - name: Deploy tested production revision
        if: inputs.verify_only != true
        env:
          CI: 'true'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ vars.VITE_FIREBASE_VAPID_KEY }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_MAPBOX_TOKEN: ${{ vars.VITE_MAPBOX_TOKEN }}
        run: npm run deploy:prod

      - name: Verify production assets
        if: inputs.verify_only != true
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const base = 'https://tripmate-2wg.pages.dev';
          for (const path of ['/index.html', '/sw.js', '/compatibility.json']) {
            let matches = false;
            for (let attempt = 0; attempt < 12; attempt++) {
              const response = await fetch(base + path, { cache: 'no-store', signal: AbortSignal.timeout(15_000) });
              matches = response.ok && Buffer.from(await response.arrayBuffer()).equals(fs.readFileSync('dist' + path));
              if (matches) break;
              await new Promise(resolve => setTimeout(resolve, 5_000));
            }
            if (!matches) throw new Error(`Production asset differs from tested revision: ${path}`);
            console.log(`Verified ${path}`);
          }
          NODE
