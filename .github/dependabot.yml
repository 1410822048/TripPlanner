# Automated dependency update PRs. Every PR runs the full CI `check` job
# (audit gate, lint, typecheck, all test suites, rules emulator, build);
# nothing deploys until a PR is merged to main.
#
# Every merge to main deploys, so the weekly volume is kept to one PR per
# lockfile: ALL minor + patch updates land together in `minor-and-patch`.
# The named groups take majors only, so packages that must move together
# (Cloudflare toolchain, Firebase SDKs, react-pdf, Vitest, React) still get
# one PR per breaking change instead of being split.
version: 2
updates:
  # Root lockfile — covers the workspaces too (packages/*, workers/ocr).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Taipei
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
    groups:
      cloudflare:
        patterns: ['wrangler', '@cloudflare/*', 'miniflare']
        update-types: ['major']
      firebase:
        patterns: ['firebase', 'firebase-*', '@firebase/*']
        update-types: ['major']
      pdf:
        patterns: ['pdfjs-dist', 'react-pdf']
        update-types: ['major']
      vitest:
        patterns: ['vitest', '@vitest/*', '@testing-library/*', 'jsdom']
        update-types: ['major']
      react:
        patterns: ['react', 'react-dom', 'react-router*', '@types/react*', 'babel-plugin-react-compiler']
        update-types: ['major']
      minor-and-patch:
        update-types: ['minor', 'patch']
    ignore:
      # jsdom 30 breaks camelCase SVG attribute-value selectors used by the
      # component tests; stay on 29 until that is fixed upstream.
      - dependency-name: jsdom
        versions: ['>=30']
      # pdfjs-dist is never bumped on its own: it must equal the pdf.js that
      # react-pdf pins (src/utils/pdfJs.version.test.ts). When a react-pdf PR
      # arrives, set pdfjs-dist (root + workers/ocr) to react-pdf's version in
      # the same PR; until then that test keeps the PR red.
      - dependency-name: pdfjs-dist
      # firebase 13 needs @firebase/rules-unit-testing 6 (which peers ^13) in
      # the same change; Dependabot proposes them separately, so both stay
      # red. Migrate the pair by hand.
      - dependency-name: firebase
        versions: ['>=13']
      - dependency-name: '@firebase/rules-unit-testing'
        versions: ['>=6']
      # vitest 5 is a hand migration (see the dependency-upgrade notes);
      # @cloudflare/vitest-plugin itself already peers vitest ^4.1 || ^5.
      - dependency-name: vitest
        versions: ['>=5']
      - dependency-name: '@vitest/*'
        versions: ['>=5']
      # Babel 8 + babel-plugin-react-compiler 1.x memoises fewer components
      # than Babel 7 (141 vs 166 files on 2026-10-13); every test still
      # passes, so CI cannot catch it. Re-measure before taking it.
      - dependency-name: '@babel/core'
        versions: ['>=8']
      # typescript-eslint (8.71) peers typescript <6.1.0.
      - dependency-name: typescript
        versions: ['>=7']
      # Node / npm are pinned on purpose (CI + Functions engine); bump by hand.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  # firebase-functions is a standalone package, not a workspace: its own
  # package.json + package-lock.json are the only ones that describe it (and
  # the ones Cloud Build installs), so this entry can update both together.
  - package-ecosystem: npm
    directory: /firebase-functions
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps-functions)'
    groups:
      firebase:
        patterns: ['firebase', 'firebase-*', '@firebase/*']
        update-types: ['major']
      minor-and-patch:
        update-types: ['minor', 'patch']
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Same blockers as the root entry.
      - dependency-name: vitest
        versions: ['>=5']
      - dependency-name: typescript
        versions: ['>=7']

  # Workflow actions are pinned to full commit SHAs; Dependabot bumps the SHA
  # and the trailing `# vX.Y.Z` comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Taipei
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions:
        patterns: ['*']
